# corners_unit smoke：单 macro CurvMulti ILT 两尺度各一轮更新。
# 注意整像素契约：该版图 bbox 1900×1900 是 pixel 4 的整数倍（非 8），
# core 512 + 2×context 256 恰满 256 像素画布；宏 475×475 像素整除
# scales=[5,1]（475/5=95 ≥ smoothing_kernel）。

[layout]
layout = "../TestReticle/corners_unit_clear.gds"
top_cell = "TOP"
layer = 11
datatype = 0
polarity = "clear"

[partition]
macro_grid = [1, 1]
core_size_nm = 512
context_nm = 256

[lithography]
pixel_nm = 4
canvas_pixels = 256
device = "auto"

[curvmulti_ilt]
scales = [5, 1]
iterations_per_stage = 1
step_size = 0.5
smoothing_kernel = 7
sigmoid_steepness = 4.0
sigmoid_offset = 0.5
weight_process_l2 = 1.0
weight_pvband = 0.5
curvature_weight = 0.0
mask_threshold = 0.5
batch_size = 8

[output]
save_final_lithography = true
show_progress = true
work_dir = "../output/curvmulti_ilt"
final_layout = "../output/curvmulti_ilt/corners_unit_curvmulti_ilt.gds"
final_cell_mode = "single_cell"
