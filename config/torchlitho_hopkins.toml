# TorchLitho Hopkins 方法 smoke：单 macro Simple ILT 一轮更新，TCC 本征核前向。
# 与 torchlitho_abbe.toml 仅 [torchlitho].method 不同，两配置可交叉对比两方法。

[layout]
layout = "../TestReticle/corners_unit_clear.gds"
top_cell = "TOP"
layer = 11
datatype = 0
polarity = "clear"

[partition]
macro_grid = [1, 1]
core_size_nm = 512
context_nm = 256

[lithography]
model = "torchlitho"
pixel_nm = 4
canvas_pixels = 256
device = "auto"

[torchlitho]
method = "hopkins"
source_shape = "point"
sigma = 0.05
wavelength_nm = 193.0
na = 1.35
refractive_index = 1.44
defocus_min_nm = 40.0

[simple_ilt]
iterations = 1
step_size = 1.0
sigmoid_steepness = 4.0
weight_process_l2 = 1.0
weight_pvband = 0.5
curvature_weight = 0.0
mask_threshold = 0.5
batch_size = 8

[output]
save_final_lithography = true
show_progress = true
work_dir = "../output/torchlitho_hopkins"
final_layout = "../output/torchlitho_hopkins/corners_unit_torchlitho_hopkins.gds"
final_cell_mode = "single_cell"
