# gcd_45nm 多 macro 梯度 MB-OPC smoke；一轮更新可验证完整状态循环。

[layout]
layout = "../TestReticle\\p50_1024\\p50_1024_dense_line_clear.gds"
top_cell = "TOP"
layer = 11
datatype = 0
polarity = "clear"
field_size_nm = [1024, 1024]

[partition]
macro_grid = [1, 1]
core_size_nm = 1024
context_nm = 512

[lithography]
pixel_nm = 8
canvas_pixels = 256
device = "auto"

[edge]
corner_nm = 16
segment_nm = 32
max_displacement_nm = 24
miter_limit = 4.0

[gradient]
iterations = 200
learning_rate_nm = 1.0
weight_nominal_l2 = 1.0
weight_process_l2 = 0.5
weight_pvband = 1.0
epe_distance_nm = 16
batch_size = 8
target_cache_mb = 512
weight_epe = 1.0                  # 可微 EPE loss（Rev 0.2：sum 聚合 + 长度加权）
epe_steepness = 4.0
metric_trend_fields = ["total_loss", "nominal_l2_loss", "process_l2_loss", "pvband_loss", "epe", "displaced_segments"]

[output]
save_final_lithography = true
show_progress = true
work_dir = "../output/gradient_mbopc"
final_layout = "../output/gradient_mbopc/gcd_45nm_gradient_mbopc.gds"
final_cell_mode = "single_cell"
