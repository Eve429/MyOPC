[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "myopc-layout-geometry"
version = "0.1.0"
description = "High-performance hierarchical layout and geometry foundation for OPC"
requires-python = ">=3.12"
dependencies = [
    "klayout>=0.30.10,<0.31",
    "numpy>=2.5,<3",
    "pillow>=12,<13",
    "psutil>=7",
    "torch>=2.4,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["layout*", "geometry*", "opc*", "lithography*", "evaluation*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
exclude = ["Test/klayout.ipynb"]

[tool.ruff.lint]
# 门禁只检查语法、未定义名称和确定性的导入错误；中文标点、紧凑排版等
# 项目约定不交给 Ruff 改写。直接运行入口的根目录注入以及同块分号是既有约束。
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E702"]

[tool.coverage.run]
branch = true
source = ["layout", "geometry", "opc", "lithography", "evaluation"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.black]
line-length = 100
target-version = ["py312"]
