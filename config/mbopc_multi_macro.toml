# 多 macro（2×2、每 macro 多 tile）simple MB-OPC 默认配置。

[layout]
layout = "../TestReticle/bench_30um_clear.gds"
top_cell = "TOP"
layer = 11
datatype = 0
polarity = "clear"

[partition]
macro_grid = [2, 2]
# macro_size_nm = 4096
core_size_nm = 1024
context_nm = 400

[lithography]
pixel_nm = 8
canvas_pixels = 256
device = "auto"

[edge]
corner_nm = 16
segment_nm = 32
max_displacement_nm = 24
miter_limit = 4.0

[mbopc]
iterations = 8
initial_step_nm = 8
decay_every = 4
epe_distance_nm = 16
batch_size = 8
target_cache_mb = 512

[output]
save_final_lithography = true
show_progress = true
work_dir = "../output/mbopc_multi_macro"
final_layout = "../output/mbopc_multi_macro/bench_30um_mbopc.gds"
final_cell_mode = "single_cell"
